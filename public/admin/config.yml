# Sveltia CMS config — https://github.com/sveltia/sveltia-cms
# Edit this file (carefully) to change what Natasha sees in the editor.

backend:
  name: github
  repo: 614IT/loveanddevi
  branch: main
  base_url: https://loveanddevi-auth.gnosisux.workers.dev
  auth_endpoint: oauth/authorize

# Local dev: run `npx @sveltia/cms-proxy-server` and uncomment:
# local_backend: true

site_url: https://loveanddevi.pages.dev
display_url: https://loveanddevi.pages.dev
publish_mode: simple

media_folder: public/images
public_folder: /images

collections:
  - name: poems
    label: Poems
    label_singular: Poem
    folder: src/content/poems
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: 'poems/{{slug}}'
    summary: '{{title}} — {{date | date(''MMM YYYY'')}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DD', time_format: false, required: false }
      - { name: image, label: Image (optional), widget: image, required: false, media_library: { config: { multiple: false } } }
      - { name: draft, label: 'Save as draft (hide from site)', widget: boolean, default: false }
      - { name: body, label: 'Poem text', widget: text, hint: 'Just type the poem. Line breaks are preserved.' }

  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: src/content/blog
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    extension: md
    format: frontmatter
    preview_path: 'blog/{{slug}}'
    summary: '{{title}} — {{date | date(''MMM D, YYYY'')}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - { name: image, label: Cover image (optional), widget: image, required: false }
      - { name: excerpt, label: 'Short preview (shown in listings)', widget: text, required: false }
      - { name: draft, label: 'Save as draft (hide from site)', widget: boolean, default: false }
      - { name: body, label: Content, widget: markdown }

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    create: true
    delete: false
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: '{{slug}}'
    summary: '{{title}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: slug, label: 'URL path (e.g. "retreats")', widget: string, required: false, hint: 'Leave blank to auto-generate from the filename.' }
      - { name: hero_image, label: 'Hero banner image (optional)', widget: image, required: false }
      - name: layout
        label: 'Page layout'
        widget: select
        options:
          - { label: 'Default — centered reading column', value: default }
          - { label: 'Wide — full-width grid', value: wide }
          - { label: 'Centered — short centered content', value: centered }
        default: default
      - { name: show_in_nav, label: 'Show in main navigation', widget: boolean, default: false }
      - { name: nav_order, label: 'Nav order (lower = earlier)', widget: number, required: false, value_type: int }
      - { name: draft, label: 'Save as draft (hide from site)', widget: boolean, default: false }
      - { name: body, label: Content, widget: markdown }

  - name: shop
    label: Shop items
    label_singular: Shop item
    folder: src/content/shop
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: 'shop'
    summary: '{{title}} — {{price}}'
    fields:
      - { name: title, label: Product name, widget: string }
      - { name: price, label: 'Price (e.g. "$25" or "$25 + shipping")', widget: string }
      - { name: image, label: Product image, widget: image }
      - { name: stripe_link, label: 'Stripe Payment Link URL', widget: string, hint: 'Create one in Stripe → Payment Links, then paste the URL here.' }
      - { name: sold_out, label: 'Sold out', widget: boolean, default: false }
      - { name: order, label: 'Display order (lower = earlier)', widget: number, default: 0, value_type: int }
      - { name: body, label: 'Description (optional)', widget: markdown, required: false }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: 'Site info, navigation, footer'
        file: src/data/site.json
        format: json
        fields:
          - { name: title, label: 'Site title', widget: string }
          - { name: tagline, label: 'Tagline (small text under title)', widget: string }
          - { name: author, label: 'Author name', widget: string }
          - { name: contact_email, label: 'Contact email (leave blank to hide)', widget: string, required: false }
          - name: nav
            label: 'Main navigation'
            widget: list
            summary: '{{label}} → {{href}}'
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: 'URL (e.g. /retreats/)', widget: string }
          - name: footer_links
            label: 'Footer links'
            widget: list
            required: false
            summary: '{{label}} → {{href}}'
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: URL, widget: string }
          - name: colors
            label: 'Colors (advanced — change with caution)'
            widget: object
            collapsed: true
            fields:
              - { name: primary, label: Primary, widget: color }
              - { name: primary_dark, label: 'Primary dark', widget: color }
              - { name: accent, label: Accent, widget: color }
              - { name: muted, label: Muted, widget: color }
              - { name: text, label: Text, widget: color }
              - { name: bg, label: Background, widget: color }
