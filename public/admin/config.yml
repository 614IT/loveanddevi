# Sveltia CMS config — Phase 1 placeholder
# Phase 1: original Weebly HTML files are served verbatim from public/
# Phase 2: per-page content extraction into CMS-editable regions (coming next)
# Phase 3: full shop + poems + blog CMS editing

backend:
  name: github
  repo: 614IT/loveanddevi
  branch: main
  base_url: https://loveanddevi-auth.gnosisux.workers.dev
  auth_endpoint: oauth/authorize

site_url: https://loveanddevi.pages.dev
display_url: https://loveanddevi.pages.dev
publish_mode: simple

media_folder: public/uploads/1/1/2/9/112908841
public_folder: /uploads/1/1/2/9/112908841

collections:
  - name: readme
    label: 'Getting started'
    files:
      - name: info
        label: 'About this editor'
        file: README.md
        format: frontmatter
        fields:
          - { name: title, label: Title, widget: hidden, default: 'About the editor' }
          - { name: body, label: 'Note', widget: text }
