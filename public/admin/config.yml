# Sveltia CMS — form-based page editing
# Each "page" is backed by:
#   - src/templates/<slug>.html (preserves original Weebly layout verbatim)
#   - src/content/pages/<slug>.md (editable fields + body HTML)
# When saved, Astro rebuilds the page by substituting the CMS fields into
# the template, producing a pixel-identical output.

backend:
  name: github
  repo: 614IT/loveanddevi
  branch: main
  base_url: https://loveanddevi-auth.gnosisux.workers.dev
  auth_endpoint: oauth/authorize

site_url: https://loveanddevi.pages.dev
display_url: https://loveanddevi.pages.dev
publish_mode: simple

media_folder: public/uploads/1/1/2/9/112908841
public_folder: /uploads/1/1/2/9/112908841

collections:
  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    create: false
    delete: false
    extension: md
    format: frontmatter
    identifier_field: title
    summary: '{{title}}'
    preview_path: '{{slug}}.html'
    fields:
      - { name: title, label: 'Page title', widget: string, hint: 'Appears in the browser tab' }
      - name: hero_image
        label: 'Hero background image'
        widget: image
        hint: 'The big photo at the top of the page.'
      - name: body_bg
        label: 'Body background color'
        widget: color
        hint: 'Colour of the main content area below the hero.'
      - name: body
        label: 'Page content (HTML)'
        widget: markdown
        hint: 'The main content area. Edit text, add images, or format with the toolbar.'
        modes: [rich_text, raw]
        editor_components: [image]
